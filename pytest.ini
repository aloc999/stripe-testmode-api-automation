[pytest]
pythonpath = .
testpaths = tests
addopts =
    -ra
    --strict-markers
    --tb=short
    -n auto
    --html=reports/report.html
    --self-contained-html
timeout = 30
markers =
    positive: successful Stripe Test Mode responses
    negative: validation and error handling
    schema: JSON contract checks
    performance: response-time budgets
    auth: credential handling
    smoke: smallest useful pack
    live: hits api.stripe.com (invalid-key contract)
